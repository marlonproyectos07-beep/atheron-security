<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema de seguridad Atheron</title>
  <desc id="desc">Ilustración conceptual: un centro de control conectado a cámaras, alarmas, control de acceso y automatización. Representa la idea de un sistema que crece por etapas, no un producto ni certificación específica.</desc>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf1fd" />
      <stop offset="100%" stop-color="#dbe7fb" />
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0a2350" />
    </linearGradient>
    <radialGradient id="hglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <pattern id="hgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#123a7a" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <circle cx="240" cy="240" r="220" fill="url(#hbg)" />
  <circle cx="240" cy="240" r="220" fill="url(#hgrid)" />
  <circle cx="240" cy="240" r="150" fill="url(#hglow)" />

  <!-- Anillo de red -->
  <circle cx="240" cy="240" r="118" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 8" opacity="0.4" />

  <!-- Líneas de conexión hacia los 4 nodos -->
  <g stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.55">
    <line x1="240" y1="196" x2="240" y2="112" />
    <line x1="284" y1="240" x2="368" y2="240" />
    <line x1="240" y1="284" x2="240" y2="368" />
    <line x1="196" y1="240" x2="112" y2="240" />
  </g>
  <g fill="#2563eb">
    <circle cx="240" cy="154" r="3.5" />
    <circle cx="326" cy="240" r="3.5" />
    <circle cx="240" cy="326" r="3.5" />
    <circle cx="154" cy="240" r="3.5" />
  </g>

  <!-- Nodo central: centro de control Atheron -->
  <g>
    <rect x="196" y="196" width="88" height="88" rx="24" fill="url(#hub)" />
    <path d="M240 214 l24 9v18c0 17-10 28-24 33-14-5-24-16-24-33v-18Z" fill="none" stroke="#eaf1fd" stroke-width="3.5" stroke-linejoin="round" />
    <path d="M231 240l7 7 13-15" fill="none" stroke="#eaf1fd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Nodo: cámaras (arriba) -->
  <g transform="translate(240,84)">
    <circle r="28" fill="#ffffff" stroke="#123a7a" stroke-width="3" />
    <rect x="-14" y="-8" width="28" height="16" rx="6" fill="#123a7a" />
    <circle cx="6" r="6" fill="#2563eb" />
  </g>

  <!-- Nodo: alarmas (derecha) -->
  <g transform="translate(396,240)">
    <circle r="28" fill="#ffffff" stroke="#123a7a" stroke-width="3" />
    <path d="M0 -12a12 12 0 0 1 12 12v6l4 6H-16l4-6v-6a12 12 0 0 1 12-12Z" fill="#123a7a" />
    <path d="M-4 12a4 4 0 0 0 8 0" fill="none" stroke="#123a7a" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Nodo: control de acceso (abajo) -->
  <g transform="translate(240,396)">
    <circle r="28" fill="#ffffff" stroke="#123a7a" stroke-width="3" />
    <rect x="-11" y="-2" width="22" height="16" rx="4" fill="#123a7a" />
    <path d="M-6 -2v-6a6 6 0 0 1 12 0v6" fill="none" stroke="#123a7a" stroke-width="3" />
  </g>

  <!-- Nodo: automatización (izquierda) -->
  <g transform="translate(84,240)">
    <circle r="28" fill="#ffffff" stroke="#123a7a" stroke-width="3" />
    <path d="M-9 -9 a12.7 12.7 0 0 1 18 0 M9 9 a12.7 12.7 0 0 1-18 0" fill="none" stroke="#123a7a" stroke-width="3" stroke-linecap="round" />
    <circle r="4.5" fill="#123a7a" />
  </g>
</svg>
